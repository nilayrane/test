# ASP.NET Core (.NET Framework) build pipeline
# Includes Python secret retrieval

trigger:
- master

pool:
  vmImage: 'windows-latest'

variables:
  solution: '**/*.sln'
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'

steps:
- checkout: self

# Step 1: Setup Python
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.x'

# Step 2: Run the Python script to fetch secrets
- script: |
    python fetch_secrets.py
  displayName: 'Run Python script to fetch secrets'

# Step 3: Use the secret variable
- script: |
    echo "Using secret in next step"
    echo "The secret value is: $(MY_SECRET)"
  displayName: 'Use secret variable'

# Step 4: Restore NuGet packages
- task: NuGetToolInstaller@1

- task: NuGetCommand@2
  inputs:
    restoreSolution: '$(solution)'

# Step 5: Build solution
- task: VSBuild@1
  inputs:
    solution: '$(solution)'
    msbuildArgs: '/p:DeployOnBuild=true /p:WebPublishMethod=Package /p:PackageAsSingleFile=true /p:SkipInvalidConfigurations=true /p:DesktopBuildPackageLocation="$(build.artifactStagingDirectory)\WebApp.zip" /p:DeployIisAppPath="Default Web Site"'
    platform: '$(buildPlatform)'
    configuration: '$(buildConfiguration)'

# Step 6: Publish symbols
- task: PublishSymbols@1
  displayName: 'Publish Symbols Path:'
  inputs:
    SearchPattern: '**\bin\**\*.pdb'
  continueOnError: true

# Step 7: Copy build output
- task: CopyFiles@1
  displayName: 'Copy files to artifact staging directory'
  inputs:
    SourceFolder: '$(build.sourcesdirectory)'
    Contents: |
     **\bin\$(BuildConfiguration)\**
     src\*.testSettings
    TargetFolder: '$(build.artifactstagingdirectory)'
  condition: succeededOrFailed()

# Step 8: Publish artifacts
- task: PublishBuildArtifacts@1
  displayName: 'Publish Artifact: Drop'
  inputs:
    PathtoPublish: '$(build.artifactstagingdirectory)'
  condition: succeededOrFailed()
